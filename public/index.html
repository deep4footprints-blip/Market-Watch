<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dhan Pulse</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">DHAN <em>Pulse</em></div>
  <div class="meta"><span id="mkt" class="pill">—</span><span id="stamp">—</span><button id="refresh" aria-label="Refresh">↻</button></div>
</header>
<div id="banner" hidden></div>
<main id="view"></main>
<div id="toast" hidden role="status"></div>
<nav class="tabs" id="tabs">
  <button data-t="overview" class="on">Overview</button>
  <button data-t="research">Research</button>
  <button data-t="setups">Setups</button>
  <button data-t="options">Options</button>
  <button data-t="portfolio">Portfolio</button>
  <button data-t="watch">Watch</button>
  <button data-more aria-label="More">☰ More</button>
</nav>
<div id="more" class="more" hidden>
  <div class="mg"><h4>Markets</h4><button data-t="overview">Overview</button><button data-t="sectors">Sectors</button><button data-t="movers">Movers</button><button data-t="research">Research</button><button data-t="setups">Setups</button></div>
  <div class="mg"><h4>Derivatives</h4><button data-t="options">Options</button><button data-t="payoff">Payoff</button></div>
  <div class="mg"><h4>Systematic</h4><button data-t="lab">Backtest</button><button data-t="alerts">Alerts</button><button data-t="watch">Watchlists</button></div>
  <div class="mg"><h4>Portfolio &amp; journal</h4><button data-t="portfolio">Portfolio</button><button data-t="risk">Risk</button><button data-t="log">P&amp;L log</button><button data-t="journal">Journal</button></div>
  <div class="mg"><h4>Reference</h4><button data-t="tools">Tools</button><button data-t="data">Data</button><button data-t="settings">Settings</button></div>
</div>
<div id="chartm" class="modal" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
