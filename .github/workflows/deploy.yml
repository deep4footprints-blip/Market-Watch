name: Test, build instruments, deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1-5"   # 07:00 IST weekdays: refresh scrip master (new listings, index ids)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          npm test
          python3 test/instruments.test.py
      - name: Build instruments.json from Dhan scrip master
        run: python3 scripts/build_instruments.py --out public/instruments.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
