name: Test, build APK + web, publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1-5"   # 07:00 IST weekdays: refresh scrip master (new listings, index ids)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unit tests
        run: |
          npm test
          python3 test/instruments.test.py

      - name: Build instruments.json from Dhan scrip master
        run: python3 scripts/build_instruments.py --out public/instruments.json

      - name: Build Android APK (Capacitor, native HTTP = no CORS limits)
        run: |
          cd android-shell
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp ../capacitor.config.json .
          npx cap add android
          npx cap sync android
          cd ..
          # Same signing key + increasing versionCode on every build => installs as an in-place update
          python3 scripts/patch_android.py android-shell/android/app/build.gradle "$GITHUB_WORKSPACE/android-shell/debug.keystore" "${{ github.run_number }}"
          cd android-shell/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Record APK signature + version (must be identical signature across builds)
        run: |
          APK=android-shell/android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          { echo '### APK'; "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|signer #1" ; "$BT/aapt" dump badging "$APK" | grep -E "^package:"; } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Add APK to the site
        run: cp android-shell/android/app/build/outputs/apk/debug/app-debug.apk public/dhan-pulse.apk

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
