name: Build Android APK (works even if Dhan blocks browser CORS)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: python3 scripts/build_instruments.py --out public/instruments.json
      - name: Create Capacitor project
        run: |
          cd android-shell
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android
          cp ../capacitor.config.json .
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android-shell/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dhan-pulse-apk
          path: android-shell/android/app/build/outputs/apk/debug/app-debug.apk
